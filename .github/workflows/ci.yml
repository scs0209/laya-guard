name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Intentionally lightweight: mock mode never imports `laya`/torch,
      # so CI validates logic without downloading the model checkpoint.
      # fastapi + httpx are only for the dashboard route tests (skipped when missing).
      - run: pip install pyyaml pytest fastapi httpx
      - run: python -m pytest tests/ -q
      - run: LAYA_GUARD_MOCK=1 PYTHONPATH=src python eval/run_eval.py --min-acc 1.0
      - run: LAYA_GUARD_MOCK=1 PYTHONPATH=src python eval/run_eval.py --set shell --source tool --min-acc 0.96
