blank_issues_enabled: false
contact_links:
  - name: Report a vulnerability
    url: https://github.com/scs0209/laya-guard/security/advisories/new
    about: Bypasses of the guard itself (crash, hang, adapter mishandling). Please report privately.
  - name: Question or idea
    url: https://github.com/scs0209/laya-guard/discussions
    about: How to set it up, whether something fits the project, or an idea that isn't a concrete change yet.
  - name: Not sure a verdict is wrong?
    url: https://github.com/scs0209/laya-guard/discussions/98
    about: Post the command and laya-guard's answer there first, with tokens, passwords and internal names replaced (it's public). A clear miss or overblock can use the forms above.
  - name: Documentation
    url: https://github.com/scs0209/laya-guard#readme
    about: Setup, configuration, and known limitations.
