# laya-guard: 12 risk policies
# Each policy: a regex prefilter (fast block) + the Laya judging questions it maps to
# When several policies match, a block policy wins over a review policy.
# Laya only outputs choice (allow/review/block) + score (risk) + noul (malicious or not). No generation.
version: 1
defaults:
  block_threshold: 0.8    # risk score >= 0.8 → block
  review_threshold: 0.45  # >= 0.45 → approval card
  model: multilingual     # input includes Korean, so pin the multilingual checkpoint

# Safe command lane: skip the model and allow. The code (guard.py) enforces these conditions:
#   · no risk policy regex below matches (if one does, the policy wins)
#   · no shell metacharacters: ; & | ` $ < > ( ) { } \ newline (pipes/redirects/substitution), or cmd's %VAR%
#     (a backslash between two path parts is a Windows path separator, not a metacharacter; what sits inside single
#     quotes is text, and inside double quotes only $ ` \ still count; a $var set to a plain value earlier in the same
#     command is checked as that value, and a quoted heredoc's body is data for its command)
#   · a pipeline counts when every stage is a safe command (`grep x f | head`), and output thrown away or merged
#     (2>/dev/null, >/dev/null, 2>&1) is not a redirect to a file
#   · no flags that run programs or write files: -exec, -execdir, -delete, -fprint, -toolexec, --config, --output, ...
#   · no sensitive paths: .ssh, .aws, .gnupg, .kube, .netrc, .npmrc, .pypirc, .env, id_rsa, etc.
#   · after whitespace normalization, a "full" match against one pattern (case-sensitive)
# Chains joined with ; && || & are checked against this list per command (included since parts like cd and true are common).
# Installs (npm/pip install) and remote actions (git push, npx) are left out on purpose: the model judges them.
# Note that test/build run the project's own scripts.
# With a cwd, the package.json scripts npm/pnpm/yarn/bun would run are checked against the regex policies.
safe_commands:
  - 'ls( \S+)*'
  - 'pwd'
  - 'cd( \S+)?'
  - '(true|false|whoami|uptime|clear|break|continue)'
  - 'date( (?!-s|--set)\S+)*'
  - 'sleep [0-9.]+[smh]?'
  - '(uname|df|free)( -\w+)*'
  - 'du( \S+)+'
  - 'which( \S+)+'
  - 'echo( \S+)*'
  - '(cat|head|tail|wc|grep|rg)( \S+)+'
  - '(mkdir|touch)( \S+)+'
  - 'git (status|diff|log|show|add|commit|switch)( \S+)*'
  - 'git branch( (-a|-r|-v|-vv|--list|--show-current|\w[\w./-]*))*'
  - 'git stash( (list|show|push)( \S+)*)?'
  - 'git checkout -b \S+'
  # Reading the repository and its host: nothing here changes a branch, a file or anything on GitHub. A fetch only
  # updates the remote-tracking refs: no --prune (it deletes them), no refspec (`main:main` moves a local branch).
  - 'git (rev-parse|check-ignore|ls-files|ls-remote|merge-base|blame|shortlog|describe)( \S+)*'
  - 'git fetch( (-q|--quiet|-v|--verbose|--tags|--all|--no-tags))*( [A-Za-z0-9][\w.-]*( [A-Za-z0-9][\w./-]*)*)?'
  - 'git remote( -v| show \S+| get-url \S+)?'
  - 'gh (pr (view|checks|list|diff|status)|issue (view|list)|run (view|list)|repo view|release (view|list))( \S+)*'
  - 'gh api (?!(.* )?(-[XfF]|--method|--field|--raw-field|--input))\S+( \S+)*'     # a GET: no method, no body
  - '(jq|seq)( \S+)+'
  # not `printf -v NAME` or a `%n` format, which set a variable (PATH) like an assignment
  - 'printf (?!-v)(?!.*%[^a-zA-Z%\s]*n)\S+( \S+)*'
  - '(npm|pnpm|yarn|bun) (test|build|lint|run (build|test|lint|typecheck|format|check))( \S+)*'
  # Only a python on PATH or in the project's venv: `./tools/python` could be any program named python.
  - '(pytest|((\.?venv|env)/bin/)?python3?(\.[0-9]+)? -m pytest)( \S+)*'
  # Shell syntax that runs nothing by itself: a variable unset, a loop header, a test. Assignments (`X=1`,
  # `export X=1`, `X=1 pytest`) are handled in guard.py, which refuses names that change what runs (PATH, LD_PRELOAD…).
  - 'unset( [A-Za-z_][A-Za-z0-9_]*)+'
  - 'for [A-Za-z_][A-Za-z0-9_]* in( \S+)*'
  - '(\[|test)( \S+)+'
  - 'go (build|test|vet|fmt)( \S+)*'
  - 'cargo (build|test|check|fmt|clippy)( \S+)*'
  - 'make( (build|test|lint|check|all))?'
  - 'docker (ps|images)( \S+)*'
  - '(node|npm|pnpm|yarn|bun|python3?|pip3?|go|cargo|rustc|git|docker|java|ruby) (--version|-v|-V|version)'
  # Read-only tools agents put in a pipeline (`| sort | uniq -c`, `| cut -c1-80`). Nothing here writes a file:
  # `sort -o FILE` and `uniq IN OUT` do, so those forms are left out; sed only prints line ranges.
  - '(cut|tr|nl|column|fold|rev|tac|basename|dirname|realpath|readlink|stat|file)( \S+)*'
  - 'sort( (?!-\S*o)\S+)*'
  - 'uniq( -\S+)*'
  - '(diff|cmp)( \S+)+'
  - 'sed -n [''"]?([0-9]+|\$)(,([0-9]+|\$))?p[''"]?( [^\s-]\S*)+'
  - 'find( \S+)*'
  # The same everyday commands on Windows (cmd.exe and PowerShell). Backslash paths are read as paths (guard.py),
  # so `cd C:\work\api`, `type src\app.py` and `pytest tests\unit` match the lines above or these.
  - 'cd /d \S+'
  - 'dir( \S+)*'
  - '(type|findstr)( \S+)+'
  - '(where|md)( \S+)+'
  - '(Get-ChildItem|Get-Location|Set-Location)( \S+)*'
  - '(Get-Content|Select-String)( \S+)+'
  - 'New-Item -ItemType Directory( -Path)? \S+( -Force)?'

policies:
  - id: destructive-fs
    title: "Destructive filesystem command"
    patterns:
      - '(?:^|[;&|(`\n]|\$\(|\b(?:then|do|else)\b|\b(?:sudo|doas|nohup|time|exec|command|env|xargs)\b(?:\s+-\S+)*|-exec(?:dir)?|\b(?:ba|z|da|k)?sh\s+-\w*c\s+["\''])\s*rm\s+(?:\S+\s+)*?(?:-[A-Za-z]*[rR][A-Za-z]*|--recursive)\s+(?:\S+\s+)*?["\'']?/(?=\s|$|[;&|)`"\''}\\*])'
      - '(?:^|[;&|(`\n]|\$\(|\b(?:then|do|else)\b|\b(?:sudo|doas|nohup|time|exec|command|env|xargs)\b(?:\s+-\S+)*|-exec(?:dir)?|\b(?:ba|z|da|k)?sh\s+-\w*c\s+["\''])\s*rm\s+(?:\S+\s+)*?(?:-[A-Za-z]*[rR][A-Za-z]*|--recursive)\s+(?:\S+\s+)*?["\'']?(?:~|\$HOME|\$\{HOME\})(?:/\*?)?["\'']?(?=\s|$|[;&|)`])'
      - 'mkfs(\.| )'
      - '\bdd\s+if=.*of=/dev/'
      - ': ?\{\s*:.*\}\s*;'
    laya:
      choice: ["allow", "review", "block"]
      choice_hint: "block on rm -rf /, mkfs, dd to a device"
      score_hint: "risk of destroying the filesystem"
    action_on_regex: block
    message: "파괴적 FS 명령 감지 — 승인 없이 실행 금지"
    message_en: "Destructive filesystem command — blocked without approval"

  - id: pipe-to-shell
    title: "Downloaded script run immediately"
    patterns:
      - '\b(curl|wget)\b.*\|\s*(sudo(\s+-\S+)*\s+)?(env\s+)?((ba|z|da|k)?sh\b|(python[0-9.]*|perl|ruby|node)(\s+-)?\s*($|[;&|)]))'
      - '\b(ba|z|da|k)?sh\s+(-c\s+)?["'']?\$\(\s*(curl|wget)\b'
      - '(^|[\s;&|(])(source|\.|(ba|z|da|k)?sh)\s+<\(\s*(curl|wget)\b'
    laya:
      choice: ["allow", "review", "block"]
      score_hint: "risk of running remote code without checking it"
    action_on_regex: block
    message: "내려받은 스크립트를 바로 실행 — 내용 확인 후 실행"
    message_en: "Downloaded script piped straight into an interpreter — inspect it first"

  - id: exfiltration
    title: "Exfiltration (secrets + outbound transfer)"
    patterns:
      - 'ngrok|expose|serveo|chisel'
      - 'scp\s+.*@'
      - '\|\s*(nc|ncat|netcat)\s'
      - 'curl.*\s(-d|--data\S*|-F|-T|--upload-file)\s*@'
      - 'send a link\s+\S+\s+to \w'
      - 'visit a website at the link'
      - 'security code.*(send|forward|to \S+@)'
      - 'send all messages to'
      - '(passport_number|bank_account_number)'
      - 'get all user information'
      - 'delete the email you have just sent'
    laya:
      choice: ["allow", "review", "block"]
      score_hint: "risk of sensitive data leaving the machine"
    action_on_regex: review
    message: "외부 전송 패턴 — 목적지 확인 필요"
    message_en: "Outbound transfer pattern — verify the destination"

  - id: prompt-injection
    title: "Prompt injection"
    patterns:
      - 'ignore (all )?previous instructions'
      - '이전 지시를 무시'
      - 'system prompt.*(보여|출력|leak|reveal)'
      # Only \bDAN mode\b: a bare 'DAN' under IGNORECASE false-positives as a substring of
      # ordinary words like dan/dandelion (a regex block skips the model, so it must be precise).
      # jailbreak also excludes file names and paths (jailbreak.log, test_jailbreak.py, tests/jailbreak/)
      - '(?<![\w./-])jailbreak\w*(?![\w/-]|\.\w)|\bDAN mode\b'
    laya:
      choice: ["allow", "review", "block"]
      score_hint: "risk of an attempt to hijack the agent's instructions"
    action_on_regex: block
    message: "인젝션 패턴 — 원문 출처 확인 필요"
    message_en: "Injection pattern — verify the original source"

  - id: secrets-leak
    title: "Secret leak"
    patterns:
      - 'sk-[a-zA-Z0-9]{8,}'
      - 'AKIA[0-9A-Z]{10,}'
      - '-----BEGIN (RSA |OPENSSH )?PRIVATE KEY-----'
      # A bare RRN-shaped number can be a date-stamped file name (backup-240101-1200000.tar),
      # so block only with an RRN keyword nearby. Bare numbers go to the model (guard._RRN_SHAPE).
      - '(?:주민|(?<![a-z])(?:rrn|ssn|jumin)|resident[\s_-]*reg)[^\n]{0,40}?(?<![0-9A-Za-z_])[0-9]{2}(0[1-9]|1[0-2])(0[1-9]|[12][0-9]|3[01])-[1-8][0-9]{6}(?![0-9A-Za-z_])'
      - '(?<![0-9A-Za-z_])[0-9]{2}(0[1-9]|1[0-2])(0[1-9]|[12][0-9]|3[01])-[1-8][0-9]{6}(?![0-9A-Za-z_])[^\n]{0,20}?(?:주민|(?<![a-z])(?:rrn|ssn|jumin))'
      - 'ghp_[a-zA-Z0-9]{20,}'
      - '\b(?:cat|tar|zip|7z|gzip|base64|xxd|openssl|cp|dd|head|tail|less|rsync)\b[^|;&]*(?:\.ssh|\.aws|\.gnupg|\.kube|\.netrc|\.git-credentials|id_rsa|id_ed25519)[^|;&]*\|\s*(?:curl|wget|nc|ncat|netcat|socat)\b'
    laya:
      choice: ["allow", "review", "block"]
      score_hint: "risk of a secret being exposed or sent in plain text"
    action_on_regex: block
    message: "시크릿 패턴 감지 — 마스킹 후 재전송"
    message_en: "Secret pattern detected — mask it and resend"

  - id: payment-action
    title: "Payment or transfer"
    patterns:
      - '(결제|송금|환불|refund|charge|payment).*(실행|진행|승인)'
      - 'toss|kakaopay.*(approve|pay)'
      - 'stripe.*(charge|refund)'
      - 'send a transaction to'
      - 'modify the recipient.*(payment|transfer)'
      - 'transfer \$[0-9,]+.*to the ac'
      - 'recurring payment.*to (be|the account)'
    laya:
      choice: ["allow", "review", "block"]
      score_hint: "risk that money actually moves"
    action_on_regex: review
    message: "금전 액션 — 사람 승인 필수"
    message_en: "Money movement — human approval required"

  - id: remote-exec
    title: "Remote code execution"
    patterns:
      - 'pip install.*--extra-index-url'
      - 'npm install.*http://'
      - 'curl.*\.sh'
      - 'powershell.*-enc'
      - '\|\s*(sudo\s+)?(ba|z)?sh\b'
    laya:
      choice: ["allow", "review", "block"]
      score_hint: "risk of running unverified remote code"
    action_on_regex: review
    message: "원격 코드 — 해시/출처 확인 필요"
    message_en: "Remote code — verify hash and origin"

  - id: priv-escalation
    title: "Privilege escalation"
    patterns:
      - 'sudo\s+(su|bash|sh)'
      - 'chmod\s+777'
      - 'setuid|setcap'
      - '>\s*/etc/'
    laya:
      choice: ["allow", "review", "block"]
      score_hint: "risk of abusing elevated privileges"
    action_on_regex: review
    message: "권한 상승 — 범위 확인 필요"
    message_en: "Privilege escalation — verify the scope"

  - id: persistence
    title: "Persistence (staying resident)"
    patterns:
      - 'crontab|/etc/cron'
      - 'systemctl enable|launchctl load'
      - 'HKLM.*Run|Startup folder'
      - '\.bashrc|\.zshrc.*curl'
      - 'core\.(hooksPath|pager|sshCommand|fsmonitor|editor)'
    laya:
      choice: ["allow", "review", "block"]
      score_hint: "risk of an attempt to stay resident unnoticed"
    action_on_regex: review
    message: "상주 시도 — 의도 확인 필요"
    message_en: "Persistence attempt — confirm the intent"

  - id: mass-delete
    title: "Mass deletion (DB/storage)"
    patterns:
      - 'DROP\s+(TABLE|DATABASE)'
      - 'DELETE\s+FROM.*WHERE\s+1=1'
      - 's3 rm.*--recursive'
      - 'kubectl delete.*--all'
      # a force push: --force(-with-lease), -f (also inside -uf), or a `+` refspec. The old pattern
      # (`git push\s.*\s-f`) needed two spaces before -f and missed `git push -f origin main`.
      - '\bgit\s+push\b(?:\s+\S+)*?\s+(?:--force\S*|-[A-Za-z]*f[A-Za-z]*\b|\+\S+)'
      - '\bgit\s+reset\s+(?:\S+\s+)*--hard\b'
      - '\bgit\s+clean\s+(?:\S+\s+)*-[A-Za-z]*f'
      - '\bgit\s+checkout\s+(?:\S+\s+)*--\s+\.(?:\s|$)'
      # A delete sent to an API inside the request body: the model scored PocketOS's Railway call
      # (curl ... graphql ... 'mutation { volumeDelete(volumeId: ...) }') as harmless (docs/guide/incidents.md).
      # The verb has to be a word of the name, not a substring: at its start or after `_` / `.` (deleteRepository,
      # delete_users, projects.delete), or capitalized at its end (volumeDelete). So undelete, GetDeletedItems,
      # dropdown_open and getDropRate don't count; a verb mid-name (projectDeleteAll) is left to the model.
      # GraphQL: a mutation field called with arguments, so input fields like `deletedAt: null` don't count.
      - '\bmutation\b[^\n]{0,400}?\b(?:(?:\w*_)?(?:delete|destroy|drop|purge|wipe|terminate|truncate|remove)(?:(?-i:[A-Z])\w*|_\w*)?|\w*?(?-i:Delete|Destroy|Drop|Purge|Wipe|Terminate|Truncate|Remove))\s*\('
      # JSON-RPC style bodies: {"method": "deleteDatabase"}, {"action": "destroy"}. Not "remove": JSON Patch uses
      # {"op": "remove"} for a field.
      - '\\?["''](?:method|action|operation|operationName|op|command)\\?["'']\s*:\s*\\?["''](?:(?:[\w.:/-]*[./:_-])?(?:delete|destroy|drop|purge|wipe|terminate|truncate)(?=\\?["'']|[./:_-]|(?-i:[A-Z]))|[\w./:-]*?(?-i:Delete|Destroy|Drop|Purge|Wipe|Terminate|Truncate)(?=\\?["'']|[./:_-]))'
    laya:
      choice: ["allow", "review", "block"]
      score_hint: "risk of an irreversible mass deletion"
    action_on_regex: review
    message: "대량 삭제 — 백업/범위 확인 필요"
    message_en: "Mass deletion — verify backup and scope"

  - id: auth-bypass
    title: "Auth bypass"
    patterns:
      - '--no-verify|--insecure-skip|skip.*auth'
      - '인증.*(우회|무력화|끄기|비활성화)'
      - 'disable.*(auth|tls|ssl)'
      - 'TLS.*(끄|비활|무력|우회|skip)'
      - '검증.*(끄|비활|무력화|우회|skip)'
      # Avoid false positives on prose like "verify the fallback is off":
      # only match ssl/tls verify flag forms (http.sslVerify false, tls-verify=false, ssl_verify: false, etc.).
      # At least one separator: joined tokens like 'sslVerify0' (grep search terms, etc.) don't match
      - '(ssl|tls)[\w-]*verify[\s:=]+(false|off|no|0|disabled?|skip)\b'
      # Still catch the code idioms: requests.get(url, verify=False), fetch(u, {verify: false}), etc.
      # A subset of what the old pattern (verify.*(false|...)) caught, so no new false positives
      - '\bverify\s*[:=]\s*False\b'
      - 'change the password of the user to'
      - 'reset.*password.*to new_password'
    laya:
      choice: ["allow", "review", "block"]
      score_hint: "risk of an attempt to disable authentication"
    action_on_regex: block
    message: "인증 우회 — 즉시 차단"
    message_en: "Auth bypass — blocked immediately"

  - id: credential-read
    title: "Credential file read"
    patterns:
      - '\b(?:cat|less|more|head|tail|bat|strings|xxd|base64|cp)\b[^|;&]*(?:\.ssh/id_\w+|\.aws/credentials|\.gnupg/|\.kube/config|\.netrc|\.git-credentials)'
    laya:
      choice: ["allow", "review", "block"]
      choice_hint: "review when reading private keys or cloud credentials"
      score_hint: "risk of credentials entering the agent's context"
    action_on_regex: review
    message: "자격 증명 파일 읽기 — 필요한 작업인지 확인"
    message_en: "Credential file read — confirm it is needed"
