<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>laya-guard</title>
<!--
Design plan (kept here so the next change starts from it)
- Job: glance at what the agent tried and what the guard decided; spot blocks and reviews and why.
- One bold thing: the verdict tape. Each judged call is one tick; block ticks stand tall. Everything else is quiet.
- Palette, derived from the verdicts themselves: ink #14181c on cool paper #f5f6f7; allow sage #4f7a62,
  review amber #b97a0c, block vermilion #c3322a. The controls use ink, not a brand blue.
- Type: one system sans, tabular figures, sentence case. No web fonts: this page may not load anything.
- No cards. Structure is whitespace plus hairlines where they separate rows of data.
-->
<style nonce="{{NONCE}}">
:root {
  color-scheme: light dark;
  --paper: #f5f6f7; --ink: #14181c; --ink2: #4a525a; --ink3: #6b737b; --rule: #d6dade; --soft: #e6e9ec;
  --allow: #3f6b52; --review: #8f5b08; --block: #b02a22;
  --t-allow: #b3c4ba; --t-review: #d99a1e; --t-block: #c3322a;
  --sans: "Avenir Next", "Segoe UI Variable Text", "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #0c0d0e; --ink: #ebecee; --ink2: #aab0b6; --ink3: #858c93; --rule: #2c3034; --soft: #1c1f22;
    --allow: #86b799; --review: #e2a93a; --block: #ff6a5d;
    --t-allow: #34423a; --t-review: #d99a1e; --t-block: #ff5a4d;
  }
}
* { box-sizing: border-box; }
html { background: var(--paper); }
body { margin: 0; color: var(--ink); background: var(--paper); font: 15px/1.5 var(--sans); font-variant-numeric: tabular-nums; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 28px 24px 56px; }
header { display: flex; flex-wrap: wrap; gap: 12px 32px; align-items: baseline; justify-content: space-between; padding-bottom: 14px; border-bottom: 1px solid var(--rule); }
.wordmark { font-size: 17px; font-weight: 650; letter-spacing: -0.01em; }
nav { display: flex; flex-wrap: wrap; gap: 4px 22px; align-items: baseline; }
.tabs { display: flex; gap: 20px; }
.tab { border: 0; background: none; padding: 4px 0; margin: 0; font: inherit; color: var(--ink3); cursor: pointer; border-bottom: 2px solid transparent; }
.tab:hover { color: var(--ink); }
.tab[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; }
.tab:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
.quiet { color: var(--ink3); }
button.quiet { border: 0; background: none; font: inherit; padding: 4px 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
button.quiet:hover { color: var(--ink); }

.lede { margin: 40px 0 6px; font-size: clamp(24px, 3.6vw, 34px); line-height: 1.25; font-weight: 450; letter-spacing: -0.02em; max-width: 30em; }
.lede b { font-weight: 700; }
.lede .a { color: var(--allow); }
.lede .r { color: var(--review); }
.lede .b { color: var(--block); }
.note { margin: 0 0 28px; color: var(--ink2); max-width: 46em; }
.note .warn { color: var(--review); font-weight: 600; }
.note .bad { color: var(--block); font-weight: 600; }

.tape { margin: 0 0 8px; }
.tape svg { display: block; width: 100%; height: 52px; }
.tape .allow { fill: var(--t-allow); }
.tape .review { fill: var(--t-review); }
.tape .block { fill: var(--t-block); }
.tape .unknown { fill: var(--rule); }
.axis { display: flex; justify-content: space-between; color: var(--ink3); font-size: 13px; margin-bottom: 44px; }

.cols { display: grid; grid-template-columns: minmax(0, 2.3fr) minmax(250px, 1fr); gap: 56px; align-items: start; }
h2 { margin: 0 0 14px; font-size: 17px; font-weight: 650; letter-spacing: -0.01em; }
.head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 20px; margin-bottom: 4px; }
.head h2 { margin: 0; }
.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-weight: 500; color: var(--ink3); padding: 8px 14px 8px 0; border-bottom: 1px solid var(--rule); white-space: nowrap; }
td { padding: 11px 14px 11px 0; border-bottom: 1px solid var(--soft); vertical-align: baseline; }
td.num, th.num { text-align: right; padding-right: 0; }
.when { color: var(--ink3); white-space: nowrap; }
.why { color: var(--ink2); }
.hash { font-family: var(--mono); font-size: 12px; color: var(--ink3); }
.v { display: inline-flex; align-items: baseline; gap: 7px; font-weight: 600; white-space: nowrap; }
.v i { width: 7px; height: 7px; display: inline-block; background: currentColor; transform: translateY(-1px); }
.v.allow { color: var(--allow); }
.v.review { color: var(--review); }
.v.block { color: var(--block); }
.risk { white-space: nowrap; }
.risk .bar { display: inline-block; width: 34px; height: 3px; margin-left: 8px; background: var(--soft); vertical-align: middle; }
.risk .bar i { display: block; height: 100%; background: var(--ink2); }
.empty { padding: 36px 0; color: var(--ink2); }
.empty code { font-family: var(--mono); font-size: 13px; }
.more { margin-top: 12px; color: var(--ink3); font-size: 13px; }

.side section + section { margin-top: 44px; }
.pol { display: block; padding: 10px 0 11px; border-bottom: 1px solid var(--soft); }
.pol .row { display: flex; justify-content: space-between; gap: 12px; }
.pol .name { overflow-wrap: anywhere; }
.pol .split { display: flex; height: 3px; margin-top: 7px; background: var(--soft); }
.pol .split i { display: block; height: 100%; }
.pol .split .a { background: var(--t-allow); }
.pol .split .r { background: var(--t-review); }
.pol .split .b { background: var(--t-block); }
.over svg { display: block; width: 100%; height: 92px; }
.over .allow { fill: var(--t-allow); }
.over .review { fill: var(--t-review); }
.over .block { fill: var(--t-block); }
.over text { fill: var(--ink3); font-size: 12px; font-family: inherit; }
footer { margin-top: 56px; padding-top: 14px; border-top: 1px solid var(--rule); color: var(--ink3); font-size: 13px; max-width: 52em; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.nowrap { white-space: nowrap; }
@media (max-width: 1100px) { .hide-md { display: none; } }
@media (max-width: 900px) {
  .cols { grid-template-columns: minmax(0, 1fr); gap: 48px; }
  .hide-sm { display: none; }
  .wrap { padding: 20px 16px 40px; }
}
@media (max-width: 600px) {
  .hide-xs, .risk .bar { display: none; }
  th, td { padding-right: 10px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="wordmark">laya-guard</div>
    <nav aria-label="Controls">
      <div class="tabs" role="group" aria-label="Time window" id="windows">
        <button type="button" class="tab" data-window="1h" aria-pressed="false">1 hour</button>
        <button type="button" class="tab" data-window="24h" aria-pressed="true">24 hours</button>
        <button type="button" class="tab" data-window="7d" aria-pressed="false">7 days</button>
        <button type="button" class="tab" data-window="30d" aria-pressed="false">30 days</button>
        <button type="button" class="tab" data-window="all" aria-pressed="false">All time</button>
      </div>
      <button type="button" class="quiet" id="pause" aria-pressed="false">Pause updates</button>
    </nav>
  </header>

  <main>
    <p class="lede" id="lede" aria-live="polite">Loading the verdict log.</p>
    <p class="note" id="note"></p>

    <div class="tape" id="tape"></div>
    <div class="axis"><span id="tape-from"></span><span id="tape-to"></span></div>

    <div class="cols">
      <section aria-labelledby="h-recent">
        <div class="head">
          <h2 id="h-recent">Recent calls</h2>
          <div class="tabs" role="group" aria-label="Filter by verdict" id="filters">
            <button type="button" class="tab" data-filter="all" aria-pressed="true">All</button>
            <button type="button" class="tab" data-filter="allow" aria-pressed="false">Allowed</button>
            <button type="button" class="tab" data-filter="review" aria-pressed="false">Review</button>
            <button type="button" class="tab" data-filter="block" aria-pressed="false">Blocked</button>
          </div>
        </div>
        <div class="scroll"><table>
          <thead><tr><th>Time</th><th>Verdict</th><th>Risk</th><th class="hide-xs">Policy</th><th>Reason</th><th class="hide-md">Source</th><th class="num hide-md">Took</th><th class="hide-sm">Call</th></tr></thead>
          <tbody id="recent"></tbody>
        </table></div>
        <p class="more" id="recent-note"></p>
      </section>

      <div class="side">
        <section aria-labelledby="h-policies">
          <h2 id="h-policies">Policies</h2>
          <div id="policies"></div>
        </section>
        <section aria-labelledby="h-over">
          <h2 id="h-over">Calls over time</h2>
          <div class="over" id="over"></div>
        </section>
      </div>
    </div>
  </main>

  <footer id="footer"></footer>
</div>

<script nonce="{{NONCE}}">
(function () {
  "use strict";
  var state = { window: "24h", filter: "all", paused: false, data: null };
  var WINDOW_TEXT = { "1h": "in the last hour", "24h": "in the last 24 hours", "7d": "in the last 7 days", "30d": "in the last 30 days", "all": "in total" };

  function $(id) { return document.getElementById(id); }
  function el(tag, props) {
    var node = document.createElement(tag);
    if (props) {
      Object.keys(props).forEach(function (k) {
        if (k === "text") node.textContent = props[k];
        else if (k === "class") node.className = props[k];
        else node.setAttribute(k, props[k]);
      });
    }
    for (var i = 2; i < arguments.length; i++) {
      var c = arguments[i];
      if (c != null) node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    }
    return node;
  }
  function svg(tag, attrs) {
    var node = document.createElementNS("http://www.w3.org/2000/svg", tag);
    Object.keys(attrs || {}).forEach(function (k) { node.setAttribute(k, attrs[k]); });
    return node;
  }
  function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }
  function fmtInt(n) { return Number(n || 0).toLocaleString(); }
  function fmtTime(iso, withDate) {
    var d = new Date(iso);
    var t = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
    return withDate ? d.toLocaleDateString([], { month: "short", day: "numeric" }) + " " + t : t;
  }
  function fmtStamp(iso) { return new Date(iso).toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }); }
  function fmtBucket(iso, win) {
    var d = new Date(iso);
    if (win === "1h") return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    if (win === "24h") return d.toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
    return d.toLocaleDateString([], { month: "short", day: "numeric" });
  }
  function plural(n, one, many) { return fmtInt(n) + " " + (n === 1 ? one : many); }

  function renderLede(d) {
    var t = d.totals, box = $("lede");
    clear(box);
    if (!t.total) { box.textContent = "No calls were judged " + WINDOW_TEXT[d.window] + "."; return; }
    box.appendChild(el("b", { text: plural(t.total, "call was", "calls were") }));
    box.appendChild(document.createTextNode(" judged " + WINDOW_TEXT[d.window] + ". "));
    box.appendChild(el("span", { "class": "a", text: fmtInt(t.allow) + " allowed" }));
    box.appendChild(document.createTextNode(", "));
    box.appendChild(el("span", { "class": "r", text: fmtInt(t.review) + " held for review" }));
    box.appendChild(document.createTextNode(", "));
    box.appendChild(el("span", { "class": "b", text: fmtInt(t.block) + " blocked" }));
    box.appendChild(document.createTextNode("."));
  }

  function renderNote(d, ok) {
    var note = $("note"), h = d.health;
    clear(note);
    if (!ok) {
      note.appendChild(el("span", { "class": "bad", text: "Can't reach the laya-guard server." }));
      note.appendChild(document.createTextNode(" If the guard is down, hooks fall back to the offline check and calls it can't judge are let through."));
      return;
    }
    var parts = [];
    parts.push(h.mock ? ["warn", "The guard is in mock mode"] : [null, "The guard is running on the real model"]);
    note.appendChild(parts[0][0] ? el("span", { "class": parts[0][0], text: parts[0][1] }) : document.createTextNode(parts[0][1]));
    note.appendChild(document.createTextNode(h.mock ? ": verdicts come from regexes and heuristics, not the Laya model." : "."));
    if (!h.logging) {
      note.appendChild(document.createTextNode(" "));
      note.appendChild(el("span", { "class": "warn", text: "Logging is off (LAYA_GUARD_LOG=0)" }));
      note.appendChild(document.createTextNode(", so there is nothing to show."));
    } else if (d.totals.total) {
      note.appendChild(document.createTextNode(" Judging takes " + fmtInt(Math.round(d.totals.avg_latency_ms)) + " ms on average, " + fmtInt(Math.round(d.totals.p95_latency_ms)) + " ms for the slowest 5%."));
    }
  }

  function renderTape(d) {
    var box = $("tape");
    clear(box);
    var tape = d.tape || [];
    $("tape-from").textContent = tape.length ? fmtStamp(tape[0][1]) : "";
    $("tape-to").textContent = tape.length ? fmtStamp(tape[tape.length - 1][1]) : "";
    if (!tape.length) return;
    var W = Math.max(box.clientWidth || 800, 240), H = 52, step = Math.min(W / tape.length, 8), w = Math.max(step - 1.5, 1);
    var heights = { a: 12, r: 28, b: 52 }, names = { a: "allow", r: "review", b: "block" };
    var s = svg("svg", { viewBox: "0 0 " + W + " " + H, role: "img", "aria-label": "The last " + tape.length + " calls, oldest on the left. Tall marks are blocks, medium are reviews, short are allowed calls." });
    tape.forEach(function (c, i) {
      var h = heights[c[0]] || 6, name = names[c[0]] || "unknown";
      var x = W - (tape.length - i) * step;
      var r = svg("rect", { "class": name, x: x, y: H - h, width: w, height: h });
      var tip = svg("title", {});
      tip.textContent = name + ", " + fmtTime(c[1], true);
      r.appendChild(tip);
      s.appendChild(r);
    });
    box.appendChild(s);
  }

  function renderOver(rows, win, total) {
    var box = $("over");
    clear(box);
    if (!total || !rows.length) { box.appendChild(el("p", { "class": "quiet", text: "Nothing to plot." })); return; }
    var W = Math.max(box.clientWidth || 260, 200), H = 92, padB = 18, plotH = H - padB, max = 1;
    rows.forEach(function (r) { max = Math.max(max, r.allow + r.review + r.block); });
    var slot = W / rows.length, bw = Math.max(slot - 2, 1);
    var s = svg("svg", { viewBox: "0 0 " + W + " " + H, role: "img", "aria-label": "Calls per interval, " + total + " in total, busiest interval " + max });
    rows.forEach(function (r, i) {
      var x = i * slot + (slot - bw) / 2, y = plotH, g = svg("g", {});
      var tip = svg("title", {});
      tip.textContent = fmtBucket(r.t, win) + ": " + r.allow + " allowed, " + r.review + " review, " + r.block + " blocked";
      g.appendChild(tip);
      ["allow", "review", "block"].forEach(function (a) {
        var h = plotH * r[a] / max;
        if (h <= 0) return;
        y -= h;
        g.appendChild(svg("rect", { "class": a, x: x, y: y, width: bw, height: h }));
      });
      s.appendChild(g);
    });
    [[0, "start"], [rows.length - 1, "end"]].forEach(function (p) {
      var t = svg("text", { x: p[1] === "start" ? 0 : W, y: H - 3, "text-anchor": p[1] });
      t.textContent = fmtBucket(rows[p[0]].t, win);
      s.appendChild(t);
    });
    box.appendChild(s);
  }

  function renderPolicies(rows) {
    var box = $("policies");
    clear(box);
    if (!rows.length) { box.appendChild(el("p", { "class": "quiet", text: "No policies in this window." })); return; }
    rows.forEach(function (p) {
      var split = el("div", { "class": "split", "aria-hidden": "true" });
      [["a", p.allow], ["r", p.review], ["b", p.block]].forEach(function (pair) {
        if (!p.count || !pair[1]) return;
        var seg = el("i", { "class": pair[0] });
        seg.style.width = (pair[1] / p.count * 100) + "%";
        split.appendChild(seg);
      });
      box.appendChild(el("div", { "class": "pol", title: p.allow + " allowed, " + p.review + " review, " + p.block + " blocked" },
        el("div", { "class": "row" }, el("span", { "class": "name", text: p.policy_id }), el("span", { text: fmtInt(p.count) })), split));
    });
  }

  function renderRecent(rows, totalInWindow) {
    var body = $("recent");
    clear(body);
    var shown = rows.filter(function (r) { return state.filter === "all" || r.action === state.filter; });
    if (!shown.length) {
      var td = el("td", { colspan: "8", "class": "empty" });
      if (totalInWindow) td.textContent = "None of the most recent calls were " + ({ allow: "allowed", review: "held for review", block: "blocked" }[state.filter] || "judged") + ".";
      else { td.appendChild(document.createTextNode("Nothing has been judged yet. Try ")); td.appendChild(el("code", { text: "laya-guard check \"ls -la\"" })); td.appendChild(document.createTextNode(".")); }
      body.appendChild(el("tr", null, td));
    }
    var dayAgo = Date.now() - 24 * 3600 * 1000;
    var word = { allow: "allowed", review: "review", block: "blocked" };
    shown.forEach(function (r) {
      var risk = Math.max(0, Math.min(1, Number(r.risk) || 0)), fill = el("i", {});
      fill.style.width = (risk * 100) + "%";
      body.appendChild(el("tr", null,
        el("td", { "class": "when", text: fmtTime(r.ts, new Date(r.ts).getTime() < dayAgo) }),
        el("td", null, el("span", { "class": "v " + r.action }, el("i", {}), word[r.action] || String(r.action))),
        el("td", { "class": "risk" }, risk.toFixed(2), el("span", { "class": "bar", "aria-hidden": "true" }, fill)),
        el("td", { "class": "hide-xs", text: r.policy_id || "" }),
        el("td", { "class": "why", text: r.reason || "" }),
        el("td", { "class": "hide-md quiet", text: r.source || "" }),
        el("td", { "class": "num hide-md quiet nowrap", text: r.latency_ms != null ? Math.round(r.latency_ms) + " ms" : "" }),
        el("td", { "class": "hide-sm hash nowrap", title: (r.tool_len != null ? r.tool_len + " characters" : ""), text: r.tool_sha || "" })));
    });
    $("recent-note").textContent = rows.length && totalInWindow > rows.length ? "The " + rows.length + " most recent of " + fmtInt(totalInWindow) + " calls." : "";
  }

  function renderFooter(d, ok) {
    var f = $("footer");
    f.textContent = ok
      ? "Served from this machine only. The log keeps a hash and the length of each call, never the command text (" + (d.health.log_path || "") + "). laya-guard " + (d.health.version || "") + ". Updated " + fmtTime(d.generated_at, false) + (state.paused ? ", paused." : ", refreshing every 5 seconds.")
      : "Disconnected. Trying again every 5 seconds.";
  }

  function render() {
    var d = state.data;
    if (!d) return;
    renderLede(d);
    renderNote(d, true);
    renderTape(d);
    renderRecent(d.recent, d.totals.total);
    renderPolicies(d.policies);
    renderOver(d.timeline, d.window, d.totals.total);
    renderFooter(d, true);
  }

  function load() {
    return fetch("/api/stats?window=" + encodeURIComponent(state.window), { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function (data) { state.data = data; render(); })
      .catch(function () {
        $("lede").textContent = "The dashboard can't reach the server.";
        renderNote({}, false);
        renderFooter({}, false);
      });
  }

  function bindTabs(id, attr, onPick) {
    $(id).addEventListener("click", function (ev) {
      var b = ev.target.closest("button");
      if (!b) return;
      Array.prototype.forEach.call($(id).querySelectorAll("button"), function (x) { x.setAttribute("aria-pressed", String(x === b)); });
      onPick(b.getAttribute(attr));
    });
  }
  bindTabs("windows", "data-window", function (w) { state.window = w; load(); });
  bindTabs("filters", "data-filter", function (f) { state.filter = f; if (state.data) renderRecent(state.data.recent, state.data.totals.total); });
  $("pause").addEventListener("click", function () {
    state.paused = !state.paused;
    this.setAttribute("aria-pressed", String(state.paused));
    this.textContent = state.paused ? "Resume updates" : "Pause updates";
    if (!state.paused) load(); else if (state.data) renderFooter(state.data, true);
  });
  var resizeTimer = null;
  window.addEventListener("resize", function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () { if (state.data) { renderTape(state.data); renderOver(state.data.timeline, state.data.window, state.data.totals.total); } }, 150);
  });
  setInterval(function () { if (!state.paused && !document.hidden) load(); }, 5000);
  document.addEventListener("visibilitychange", function () { if (!document.hidden && !state.paused) load(); });
  load();
})();
</script>
</body>
</html>
