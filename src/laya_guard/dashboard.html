<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="laya-token" content="{{TOKEN}}">
<title>laya-guard</title>
<!--
Design plan (kept here so the next change starts from it)
- A small desktop-style app, not a long page: a sidebar with the four views, one primary action pinned at its
  bottom (install the hook), and a rounded pane on the right. Reference: the project and asset managers people
  keep open next to their editor. Earlier versions (cards everywhere, a dense terminal, one long column) were
  all rejected, so the screen stays quiet: few things per view, generous gaps, one accent colour.
- Cards carry state with their outline (amber needs a look, red is blocked) and a count badge, the way the
  reference marks projects that need attention. Everything else is plain.
- Agents are square tiles with a status dot. Clicking one shows its state; the button in the pane (or the one
  pinned in the sidebar) opens the exact diff, and nothing is written until "Apply change".
- Calls is a list on the left and the selected call on the right.
- Palette: neutral dark by default (light when the system is light), blue for the primary action, and the
  verdict colours (green, amber, red) as the only other colour.
- Type: one system sans, tabular figures. No web fonts and no external icons: this page may not load anything.
- Motion: the tape draws in once and new calls fade in. Both stop under reduced motion.
-->
<style nonce="{{NONCE}}">
:root {
  color-scheme: light dark;
  --bg: #e7e9ee; --side: #f3f4f7; --pane: #ffffff; --card: #f2f3f6; --card-hi: #e8eaef; --line: #dcdfe5;
  --text: #1a1b1f; --muted: #5b5e69; --faint: #888b96;
  --accent: #2563eb; --on-accent: #ffffff; --glow: rgba(37, 99, 235, 0.32); --ring: rgba(37, 99, 235, 0.18);
  --ok: #1d8a58; --warn: #a96a07; --bad: #c43434;
  --t-allow: #c3cac6; --t-review: #dba03a; --t-block: #d23b3b;
  --sans: ui-sans-serif, -apple-system, "SF Pro Text", "Segoe UI", system-ui, Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141518; --side: #191a1e; --pane: #1f2024; --card: #26272c; --card-hi: #2d2e35; --line: #2f3037;
    --text: #ececf0; --muted: #9c9da8; --faint: #6f707b;
    --accent: #3b82f6; --glow: rgba(59, 130, 246, 0.42); --ring: rgba(59, 130, 246, 0.26);
    --ok: #4fd08e; --warn: #f2b53a; --bad: #ff6a6a;
    --t-allow: #3b433f; --t-review: #f2b53a; --t-block: #ff6060;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--bg); }
body { margin: 0; color: var(--text); background: var(--bg); font: 14px/1.5 var(--sans); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
button:focus-visible, input:focus-visible, .search:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.ic { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--muted); }

/* shell */
.app { display: grid; grid-template-columns: 244px minmax(0, 1fr); height: 100vh; }
.side { display: flex; flex-direction: column; padding: 20px 14px 14px; background: var(--side); border-right: 1px solid var(--line); min-height: 0; }
.brand { display: flex; align-items: center; gap: 12px; padding: 2px 10px 22px; }
.logo { width: 34px; height: 34px; border-radius: 10px; background: var(--card-hi); display: grid; place-items: center; color: var(--accent); }
.wordmark { font-size: 15px; font-weight: 650; letter-spacing: -0.01em; line-height: 1.2; }
.state { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12px; }
.state i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); display: inline-block; }
.state.warn i { background: var(--warn); }
.state.bad i { background: var(--bad); }
.nav { display: flex; flex-direction: column; gap: 4px; }
.nav button { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 11px; color: var(--muted); }
.nav button:hover { background: var(--card); color: var(--text); }
.nav button[aria-current="page"] { background: var(--card-hi); color: var(--text); }
.grow { flex: 1; }
.cta { display: flex; align-items: center; gap: 12px; width: 100%; padding: 13px 16px; border-radius: 999px; font-weight: 600; background: var(--card-hi); color: var(--text); }
.cta .sub { display: block; font-size: 11.5px; font-weight: 400; opacity: 0.78; line-height: 1.25; }
.cta.primary { background: var(--accent); color: var(--on-accent); box-shadow: 0 8px 26px var(--glow); }
.cta.primary:hover { filter: brightness(1.08); }
.cta.ok { background: transparent; border: 1px solid var(--line); color: var(--ok); }
.cta.bad { background: transparent; border: 1.5px solid var(--bad); color: var(--bad); }
.cta.quiet { background: var(--card); color: var(--muted); }
.foot { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--line); margin-top: 16px; padding-top: 12px; }
.icon-btn { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; color: var(--muted); }
.icon-btn:hover { background: var(--card); color: var(--text); }

.main { display: flex; flex-direction: column; min-width: 0; height: 100vh; padding: 0 18px 18px; }
.top { display: flex; align-items: center; gap: 14px; padding: 18px 6px 16px; flex-wrap: wrap; }
.top h1 { margin: 0; font-size: 19px; font-weight: 650; letter-spacing: -0.015em; }
.search { display: none; flex: 1; max-width: 440px; margin: 0 auto; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 0 16px; height: 38px; color: var(--faint); }
.search input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: var(--text); font: inherit; }
.search input::placeholder { color: var(--faint); }
.app[data-view="calls"] .search { display: flex; }
.top .push { margin-left: auto; }
.seg { display: inline-flex; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.seg button { padding: 4px 13px; border-radius: 999px; color: var(--muted); font-size: 13px; white-space: nowrap; }
.seg button:hover { color: var(--text); }
.seg button[aria-pressed="true"] { background: var(--card-hi); color: var(--text); }
.app[data-view="agents"] #windows { display: none; }

.stage { flex: 1; min-height: 0; }
.view { height: 100%; }
.pane { background: var(--pane); border: 1px solid var(--line); border-radius: 20px; padding: 34px 38px 44px; overflow: auto; min-height: 0; }
.inner { max-width: 860px; }

/* overview */
h2 { margin: 0; font-size: 30px; line-height: 1.15; font-weight: 650; letter-spacing: -0.03em; }
.split { margin: 10px 0 0; font-size: 16px; line-height: 1.5; color: var(--muted); }
.split .a { color: var(--ok); } .split .r { color: var(--warn); } .split .b { color: var(--bad); }
.note { margin: 10px 0 0; font-size: 13px; color: var(--muted); max-width: 42em; }
.note .warn { color: var(--warn); } .note .bad { color: var(--bad); }
.tape { margin: 40px 0 8px; }
.tape svg { display: block; width: 100%; height: 64px; overflow: visible; }
.tick { cursor: pointer; transform-box: fill-box; transform-origin: bottom; transition: opacity 0.15s; }
.tick.allow { fill: var(--t-allow); } .tick.review { fill: var(--t-review); } .tick.block { fill: var(--t-block); } .tick.unknown { fill: var(--line); }
.tape:hover .tick { opacity: 0.45; } .tape .tick:hover { opacity: 1; }
.tape.intro .tick { animation: draw 0.5s cubic-bezier(0.2, 0.7, 0.2, 1) backwards; }
.tape .base { stroke: var(--line); stroke-width: 1; }
.axis { display: flex; justify-content: space-between; color: var(--faint); font-size: 12px; }
.label { margin: 40px 0 12px; font-size: 11.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 18px 14px; padding-top: 8px; }
.foot-note { margin: 56px 0 0; color: var(--faint); font-size: 12px; line-height: 1.7; max-width: 46em; }
.foot-note kbd, .help kbd { font: inherit; color: var(--muted); border: 1px solid var(--line); border-radius: 5px; padding: 0 6px; }

/* cards: state is the outline, the badge is a count */
.card { position: relative; display: block; width: 100%; background: var(--card); border: 1.5px solid transparent; border-radius: 14px; padding: 14px 16px; }
button.card:hover { background: var(--card-hi); }
.card.sel { background: var(--card-hi); border-color: var(--line); }
.card.warn { border-color: var(--warn); }
.card.bad { border-color: var(--bad); }
.card .t { font-weight: 600; font-size: 14px; }
.card .s { color: var(--faint); font-size: 12.5px; margin-top: 1px; overflow-wrap: anywhere; }
.badge { position: absolute; top: -9px; right: -7px; min-width: 22px; height: 22px; padding: 0 7px; border-radius: 999px; background: var(--bad); color: #fff; font-size: 11.5px; font-weight: 700; display: grid; place-items: center; }
.badge.warn { background: var(--warn); color: #1c1503; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; background: var(--faint); }
.dot.allow, .dot.ok { background: var(--ok); } .dot.review, .dot.warn { background: var(--warn); } .dot.block, .dot.bad { background: var(--bad); }
.pill { display: inline-flex; align-items: center; gap: 8px; padding: 5px 13px; border-radius: 999px; border: 1px solid var(--line); font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.pill.ok { color: var(--ok); border-color: var(--ok); } .pill.warn { color: var(--warn); border-color: var(--warn); } .pill.bad { color: var(--bad); border-color: var(--bad); }

/* agents */
.pane-head { display: flex; align-items: center; gap: 16px; padding-bottom: 22px; border-bottom: 1px solid var(--line); }
.pane-head .tile-lg { width: 48px; height: 48px; border-radius: 14px; background: var(--card); display: grid; place-items: center; color: var(--muted); flex: none; }
.pane-head .tile-lg .ic { width: 24px; height: 24px; }
.pane-head h2 { font-size: 21px; letter-spacing: -0.02em; }
.pane-head .sub { color: var(--faint); font-size: 12.5px; overflow-wrap: anywhere; }
.pane-head .pill { margin-left: auto; }
.tiles { display: flex; flex-wrap: wrap; gap: 14px; margin: 0; }
.tilebox { display: flex; flex-direction: column; align-items: center; gap: 7px; width: 76px; }
.tile { position: relative; width: 58px; height: 58px; border-radius: 17px; background: var(--card); border: 1.5px solid var(--line); display: grid; place-items: center; color: var(--text); }
.tile:hover { background: var(--card-hi); }
.tile[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 4px var(--ring); }
.tile .ic { width: 26px; height: 26px; }
.tile.off { color: var(--muted); }
.tile.add { border-style: dashed; background: transparent; color: var(--faint); cursor: default; }
.tile .sdot { position: absolute; right: -4px; bottom: -4px; width: 13px; height: 13px; border-radius: 50%; border: 2.5px solid var(--pane); background: var(--faint); }
.tile .sdot.ok { background: var(--ok); } .tile .sdot.warn { background: var(--warn); } .tile .sdot.bad { background: var(--bad); }
.tilelabel { font-size: 12px; color: var(--muted); max-width: 76px; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.agent-body { margin-top: 36px; padding: 26px 28px 28px; background: var(--card); border-radius: 16px; max-width: 640px; }
.agent-body h3 { margin: 0; font-size: 18px; font-weight: 620; letter-spacing: -0.015em; }
.agent-body p { margin: 8px 0 0; color: var(--muted); font-size: 14px; max-width: 34em; }
.agent-body .row { margin-top: 20px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.agent-facts { margin: 24px 0 0; display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 22px; font-size: 13px; }
.agent-facts dt { color: var(--faint); } .agent-facts dd { margin: 0; overflow-wrap: anywhere; }
.btn { padding: 9px 20px; border-radius: 999px; border: 1px solid var(--line); background: var(--card-hi); color: var(--text); font-size: 14px; font-weight: 500; white-space: nowrap; }
.btn:hover { filter: brightness(1.08); }
.btn.primary { background: var(--accent); border-color: transparent; color: var(--on-accent); box-shadow: 0 6px 20px var(--glow); }
.btn[disabled] { opacity: 0.45; cursor: default; box-shadow: none; filter: none; }

/* calls */
.split-view { display: grid; grid-template-columns: minmax(280px, 370px) minmax(0, 1fr); gap: 16px; }
.listcol { overflow: auto; min-height: 0; padding: 2px 4px 2px 2px; }
.listhead { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 2px 4px 12px; background: var(--bg); }
.listhead .label { margin: 0; }
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.call { padding: 11px 14px 12px; }
.call .head { display: flex; align-items: center; gap: 9px; }
.call .verdict { font-weight: 600; font-size: 13.5px; }
.verdict.allow { color: var(--ok); } .verdict.review { color: var(--warn); } .verdict.block { color: var(--bad); }
.call .when { margin-left: auto; color: var(--faint); font-size: 12px; }
.call .s { margin-top: 3px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.call.new { animation: arrive 0.5s ease-out; }
.list-foot { padding: 14px 6px 6px; color: var(--faint); font-size: 12px; }
.empty { padding: 30px 8px; color: var(--muted); text-align: center; }
.empty code { font: 13px var(--mono); }
.empty-pane { height: 100%; min-height: 260px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: var(--faint); text-align: center; }
.empty-pane .big { width: 70px; height: 70px; border-radius: 50%; background: var(--card); display: grid; place-items: center; }
.empty-pane .big .ic { width: 30px; height: 30px; }
.empty-pane .title { color: var(--text); font-size: 16px; font-weight: 600; }
.facts { margin: 26px 0 0; display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 10px 32px; font-size: 14px; }
.facts dt { color: var(--faint); } .facts dd { margin: 0; overflow-wrap: anywhere; }
.facts .mono { font: 13px var(--mono); }
.pane-head .vbig { font-size: 22px; font-weight: 650; letter-spacing: -0.02em; }

/* policies */
.stack { display: flex; flex-direction: column; gap: 14px; margin-top: 28px; }
.meter { display: flex; height: 5px; margin-top: 12px; background: var(--card-hi); border-radius: 3px; overflow: hidden; }
.meter i { display: block; height: 100%; }
.meter .a { background: var(--t-allow); } .meter .r { background: var(--t-review); } .meter .b { background: var(--t-block); }

/* dialogs */
.help, .sheet { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.55); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 6; }
.help.show, .sheet.show { display: flex; }
.help .box, .sheet .box { background: var(--pane); border: 1px solid var(--line); border-radius: 20px; padding: 28px 30px; width: 100%; }
.help .box { max-width: 420px; }
.help h2, .sheet h2 { font-size: 20px; letter-spacing: -0.02em; margin: 0 0 14px; }
.help dl { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 8px 24px; font-size: 14px; }
.help dt { font-weight: 600; } .help dd { margin: 0; color: var(--muted); }
.sheet .box { max-width: 700px; max-height: 88vh; overflow: auto; }
.sheet h2 { margin-bottom: 6px; }
.sheet .lead { margin: 0 0 18px; color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
pre.diff { margin: 0 0 20px; padding: 14px 16px; background: var(--card); border-radius: 12px; overflow: auto; max-height: 300px; font: 12.5px/1.55 var(--mono); white-space: pre; }
pre.diff .add { color: var(--ok); } pre.diff .del { color: var(--bad); } pre.diff .meta { color: var(--faint); }
.sheet .err { color: var(--bad); font-size: 14px; margin: -4px 0 16px; }
.sheet .actions { display: flex; gap: 12px; justify-content: flex-end; flex-wrap: wrap; }
.checks { list-style: none; margin: 0 0 20px; padding: 0; font-size: 14px; }
.checks li { padding: 3px 0; } .checks .ok { color: var(--ok); } .checks .no { color: var(--bad); }

@keyframes draw { from { transform: scaleY(0); } to { transform: scaleY(1); } }
@keyframes arrive { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) {
  .tape.intro .tick, .call.new { animation: none; }
  .tick { transition: none; }
}

/* narrow: the sidebar becomes a bar on top and the page scrolls normally */
@media (max-width: 1040px) {
  .split-view { grid-template-columns: 1fr; height: auto; }
  .listcol { overflow: visible; }
  .split-view .pane { order: -1; }
}
@media (max-width: 860px) {
  .app { display: block; height: auto; min-height: 100vh; }
  .side { position: sticky; top: 0; z-index: 4; flex-direction: row; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 12px 14px 10px; border-right: 0; border-bottom: 1px solid var(--line); }
  .brand { padding: 0; }
  .nav { flex-direction: row; width: 100%; overflow-x: auto; gap: 0; order: 3; scrollbar-width: none; }
  .nav::-webkit-scrollbar, .seg::-webkit-scrollbar { display: none; }
  .nav button { padding: 8px 10px; gap: 8px; flex: none; }
  .grow, .foot, .cta { display: none; }
  .main { height: auto; padding: 0 12px 24px; }
  .stage, .view { height: auto; }
  .top { padding: 16px 4px 12px; }
  .search { order: 5; flex-basis: 100%; max-width: none; margin: 0; }
  .pane { padding: 24px 20px 32px; overflow: visible; }
  .top .push { margin-left: 0; }
  .seg { max-width: 100%; overflow-x: auto; scrollbar-width: none; }
  .seg button { padding: 4px 10px; }
}
@media (max-width: 430px) {
  .nav button .ic { display: none; }
  .nav button { flex: 1; justify-content: center; padding: 8px 6px; }
}
</style>
</head>

<div class="app" id="app" data-view="overview">
  <aside class="side">
    <div class="brand">
      <span class="logo"><svg class="ic" aria-hidden="true"><use href="#i-shield"/></svg></span>

<script nonce="{{NONCE}}">
(function () {
  "use strict";
  var WINDOWS = ["1h", "24h", "7d", "30d", "all"];
  var WINDOW_TEXT = { "1h": "in the last hour", "24h": "in the last 24 hours", "7d": "in the last 7 days", "30d": "in the last 30 days", "all": "in total" };
  var WORD = { allow: "Allowed", review: "Review", block: "Blocked" };
  var VIEWS = ["overview", "agents", "calls", "policies"];
  var TITLES = { overview: "Overview", agents: "Agents", calls: "Calls", policies: "Policies" };
  var state = { agent: null, view: "overview", window: "24h", filter: "all", query: "", paused: false, data: null, sig: "", sel: null, seen: null, drawn: false };

  function $(id) { return document.getElementById(id); }

  }

    return node;
  }
  function ic(name, cls) {
    var s = svg("svg", { "class": "ic" + (cls ? " " + cls : ""), "aria-hidden": "true" });
    s.appendChild(svg("use", { href: "#i-" + name }));
    return s;
  }
  function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }
  function fmtInt(n) { return Number(n || 0).toLocaleString(); }
  function fmtTime(iso) { return new Date(iso).toLocaleTimeString([], { hour12: false, hour: "2-digit", minute: "2-digit", second: "2-digit" }); }
  function fmtStamp(iso) { return new Date(iso).toLocaleString([], { hour12: false, month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }); }

  var LETTER = { allow: "a", review: "r", block: "b" };

  // --- sidebar ---
  function renderState(d, ok) {
    var box = $("state"), h = (d && d.health) || {};
    clear(box);
    var cls = "state", text;
    if (!ok) { cls += " bad"; text = "Server unreachable"; }
    else if (h.mock) { cls += " warn"; text = "Mock mode"; }
    else if (!h.logging) { cls += " warn"; text = "Logging is off"; }
    else text = state.paused ? "Paused" : "Running";
    box.className = cls;
    box.appendChild(el("i"));
    box.appendChild(document.createTextNode(text));
  }

  // --- agents: install or remove the hook from here ---
  var TOKEN = (document.querySelector('meta[name="laya-token"]') || {}).content || "";
  var agentsSig = "", agentList = [], pending = null;
  var STATES = {
    "installed": { cls: "ok", pill: "Protected", head: "Claude Code is protected.", body: "Each Bash call is judged before Claude Code runs it. You can remove the hook any time; the settings file is backed up first.", btn: "Remove", action: "uninstall", cta: "ok", ctaText: "Protected" },
    "not-installed": { cls: "warn", pill: "Not protected", head: "Claude Code isn't protected yet.", body: "Installing adds a hook that sends each Bash call to laya-guard before it runs. You see the exact change first, and the settings file is backed up.", btn: "Install hook", action: "install", primary: true, cta: "primary", ctaText: "Install hook" },
    "manual": { cls: "", pill: "Hook added by hand", head: "A laya-guard hook is already in the file.", body: "It was written by hand, so laya-guard leaves it alone. Let laya-guard manage it to get backups and repairs.", btn: "Let laya-guard manage it", action: "install", force: true, cta: "quiet", ctaText: "Review hook" },
    "broken": { cls: "bad", pill: "Needs repair", head: "The hook points to a file that is gone.", body: "This happens after laya-guard is reinstalled or moved. Repair points the hook at the current install.", btn: "Repair hook", action: "install", primary: true, cta: "bad", ctaText: "Repair hook" },
    "unsupported": { cls: "", pill: "Found", btn: null, cta: "quiet", ctaText: "Not supported yet" },
    "invalid": { cls: "bad", pill: "Settings unreadable", head: "The settings file isn't valid JSON.", body: "Nothing was changed. Fix the file first, then reload this page.", btn: null, cta: "bad", ctaText: "Settings invalid" }
  };
  function stateOf(a) { return STATES[a.state] || STATES.invalid; }
  var ICONS = { "claude-code": "spark", "codex": "terminal", "cursor": "cursor", "gemini-cli": "star4" };
  // the agent the sidebar button and the overview card talk about: the first one laya-guard can protect
  function primary() { for (var i = 0; i < agentList.length; i++) if (agentList[i].supported) return agentList[i]; return null; }
  function selected() {
    for (var i = 0; i < agentList.length; i++) if (agentList[i].id === state.agent) return agentList[i];
    return agentList[0] || null;
  }
  function startChange(a) { var s = stateOf(a); if (s.btn) openSheet(a, s.action, s.force || (s.action === "install" && a.managed === false)); }

  function api(method, url, body) {
    var opts = { method: method, cache: "no-store", headers: {} };
    if (body) { opts.headers["Content-Type"] = "application/json"; opts.headers["X-Laya-Token"] = TOKEN; opts.body = JSON.stringify(body); }

  // the one button pinned under the nav: install, repair, or a quiet "Protected"
  function renderCta() {
    var b = $("cta"), a = primary();
    clear(b);
    if (!a) { b.hidden = true; return; }

    b.hidden = false;

    b.appendChild(ic(s.cls === "ok" ? "check" : "shield"));
    b.appendChild(el("span", null, document.createTextNode(s.ctaText), el("span", { "class": "sub", text: a.name })));
  }

  function renderAgentsView() {
    var box = $("agent-pane");

    state.agent = a.id;
    var s = stateOf(a), found = a.via && a.via.length ? a.via.join(", ") : "Not found on this machine";
    box.appendChild(el("div", { "class": "pane-head" },
      el("span", { "class": "tile-lg" }, ic(a.supported ? "folder" : (ICONS[a.id] || "spark"))),
      el("div", null, el("h2", { text: a.supported ? "All projects" : a.name }), el("div", { "class": "sub", text: a.supported ? a.path : "No hook support yet" })),
      el("span", { "class": "pill " + s.cls }, el("i", { "class": "dot " + s.cls }), s.pill)));
    box.appendChild(el("div", { "class": "label", text: "Agents on this machine" }));
    var tiles = el("div", { "class": "tiles" });
    agentList.forEach(function (ag) {
      var st = stateOf(ag);
      var tile = el("button", { type: "button", "class": "tile" + (ag.supported ? "" : " off"), "aria-pressed": String(ag.id === a.id), title: ag.name + ": " + st.pill }, ic(ICONS[ag.id] || "spark"), el("i", { "class": "sdot " + st.cls }));
      tile.addEventListener("click", function () { state.agent = ag.id; renderAgentsView(); });
      tiles.appendChild(el("div", { "class": "tilebox" }, tile, el("span", { "class": "tilelabel", text: ag.name })));
    });
    tiles.appendChild(el("div", { "class": "tilebox" },
      el("span", { "class": "tile add", title: "laya-guard can only protect Claude Code so far", role: "img", "aria-label": "More agents are not supported yet" }, ic("plus")),
      el("span", { "class": "tilelabel", text: "More later" })));
    box.appendChild(tiles);

    var head = a.supported ? s.head : a.name + " is on this machine.";
    var text = a.supported ? s.body : "laya-guard can't install a hook for it yet. Claude Code is the only agent it can protect so far.";
    var body = el("div", { "class": "agent-body" }, el("h3", { text: head }), el("p", { text: text }));
    if (a.supported && !a.found) body.appendChild(el("p", { text: "Claude Code wasn't found on this machine, but you can set the hook up now." }));
    if (a.state === "invalid" && a.detail) body.appendChild(el("p", { text: a.detail }));
    if (s.btn) {
      var b = el("button", { type: "button", "class": "btn" + (s.primary ? " primary" : ""), text: s.btn });
      b.addEventListener("click", function () { startChange(a); });
      body.appendChild(el("div", { "class": "row" }, b));
    }
    var facts = el("dl", { "class": "agent-facts" }, el("dt", { text: "Found" }), el("dd", { text: found }));
    if (a.supported) {
      facts.appendChild(el("dt", { text: "File" })); facts.appendChild(el("dd", { text: a.path }));
      facts.appendChild(el("dt", { text: "Applies to" })); facts.appendChild(el("dd", { text: "Every project you open with " + a.name }));
      facts.appendChild(el("dt", { text: "Changes" })); facts.appendChild(el("dd", { text: "Only the laya-guard hook entry; your other settings stay" }));
    } else {
      facts.appendChild(el("dt", { text: "Hook" })); facts.appendChild(el("dd", { text: "Not supported yet" }));
    }
    body.appendChild(facts);
    box.appendChild(body);
  }

  function loadAgents() {
    if ($("sheet").classList.contains("show")) return Promise.resolve();
    return api("GET", "/api/agents").then(function (j) {
      var sig = JSON.stringify(j.agents);
      if (sig === agentsSig) return;
      agentsSig = sig; agentList = j.agents;
      renderCta();
      if (state.view === "agents") renderAgentsView();
      if (state.view === "overview" && state.data) renderCards(state.data);
    }).catch(function () {});
  }

  // --- overview ---
  function renderHero(d, ok) {
    var lede = $("lede"), split = $("split"), note = $("note"), t = d && d.totals, h = (d && d.health) || {};
    clear(split); clear(note);
    if (!ok) {
      lede.textContent = "The dashboard can't reach the server.";
      note.appendChild(el("span", { "class": "bad", text: "If the guard is down, hooks fall back to the offline check and let through what it can't judge." }));
      return;
    }
    if (!t.total) {
      lede.textContent = "No calls were judged " + WINDOW_TEXT[d.window] + ".";
    } else {
      lede.textContent = plural(t.total, "call", "calls") + " judged " + WINDOW_TEXT[d.window] + ".";
      split.appendChild(el("span", { "class": "a", text: fmtInt(t.allow) + " allowed" }));
      split.appendChild(document.createTextNode(", "));
      split.appendChild(el("span", { "class": "r", text: fmtInt(t.review) + " held for review" }));
      split.appendChild(document.createTextNode(" and "));
      split.appendChild(el("span", { "class": "b", text: fmtInt(t.block) + " blocked" }));
      split.appendChild(document.createTextNode("."));
    }
    if (h.mock) { note.appendChild(el("span", { "class": "warn", text: "Mock mode: " })); note.appendChild(document.createTextNode("verdicts come from regexes and heuristics, not the Laya model.")); }

    else if (t.total) note.appendChild(document.createTextNode("The guard is running on the real model. Judging takes " + fmtInt(Math.round(t.avg_latency_ms)) + " ms on average."));
  }

  function renderTape(d) {
    var box = $("tape");
    clear(box);
    var tape = d.tape || [];
    var W = Math.max(box.clientWidth || 760, 200), H = 64, step = 7, tw = 3;
    var cap = Math.max(Math.floor(W / step), 10), items = tape.slice(-cap);

    var heights = { a: 16, r: 34, b: 64 }, names = { a: "allow", r: "review", b: "block" };
    var s = svg("svg", { viewBox: "0 0 " + W + " " + H, role: "img", "aria-label": "The last " + items.length + " calls, oldest on the left. Tall red lines are blocks, amber are reviews, short grey are allowed calls." });
    s.appendChild(svg("line", { "class": "base", x1: 0, x2: W, y1: H - 0.5, y2: H - 0.5 }));

      s.appendChild(r);
    });

    state.drawn = true;
  }

  function attentionCard(opts) {

    if (opts.badge) card.appendChild(el("span", { "class": "badge" + (opts.cls === "warn" ? " warn" : ""), text: fmtInt(opts.badge) }));
    card.addEventListener("click", opts.go);

  }

  function renderCards(d) {
    var box = $("cards"), t = d.totals, a = primary();
    clear(box);
    if (a) {
      var s = stateOf(a);
      box.appendChild(attentionCard({ title: a.name, sub: s.pill + ", all projects", cls: a.state === "installed" ? "" : (s.cls === "warn" ? "warn" : s.cls === "bad" ? "bad" : ""),
        go: function () { if (a.state === "not-installed" || a.state === "broken") startChange(a); else setView("agents"); } }));
    }
    box.appendChild(attentionCard({ title: "Blocked", sub: "Stopped before they ran", cls: t.block ? "bad" : "", badge: t.block, go: function () { setFilter("block"); setView("calls"); } }));
    box.appendChild(attentionCard({ title: "Held for review", sub: "Waiting for your answer", cls: t.review ? "warn" : "", badge: t.review, go: function () { setFilter("review"); setView("calls"); } }));
    box.appendChild(attentionCard({ title: "Allowed", sub: "Ran as usual", cls: "", go: function () { setFilter("allow"); setView("calls"); } }));
  }

  function renderFooter(d, ok) {
    var f = $("footer");
    clear(f);
    if (!ok) { f.textContent = "Disconnected. Trying again every 5 seconds."; return; }
    f.appendChild(document.createTextNode("Served from this machine only. The log keeps a hash and the length of each call, never the command text (" + (d.health.log_path || "") + "). laya-guard " + (d.health.version || "") + (state.paused ? ", updates paused." : ", refreshing every 5 seconds.") + " Press "));
    f.appendChild(el("kbd", { text: "?" }));
    f.appendChild(document.createTextNode(" for keyboard shortcuts."));
  }

  // --- calls ---
  function matches(r) {
    if (state.filter !== "all" && r.action !== state.filter) return false;
    var q = state.query;
    if (!q) return true;

  }

  var VICON = { allow: "check", review: "alert", block: "ban" };

  function renderCalls(fresh) {

    if (!rows.length) {
      var li = el("li", { "class": "empty" });
      if (!d.totals.total) { li.appendChild(document.createTextNode("Nothing has been judged yet. Try ")); li.appendChild(el("code", { text: "laya-guard check \"ls -la\"" })); li.appendChild(document.createTextNode(".")); }

      list.appendChild(li);
    }
    rows.forEach(function (r) {
      var id = callId(r), isNew = fresh && state.seen && !state.seen[id];
      var btn = el("button", { type: "button", "class": "card call" + (id === state.sel ? " sel" : "") + (isNew ? " new" : ""), "data-id": id },
        el("div", { "class": "head" }, el("i", { "class": "dot " + r.action }), el("span", { "class": "verdict " + r.action, text: WORD[r.action] || String(r.action) }), el("span", { "class": "when", text: fmtTime(r.ts) })),
        el("div", { "class": "s", text: r.reason || r.policy_id || "" }));
      list.appendChild(el("li", null, btn));
    });
    var seen = {};
    d.recent.forEach(function (r) { seen[callId(r)] = true; });
    state.seen = seen;
    if (rows.length && d.totals.total > d.recent.length) foot.textContent = "The latest " + d.recent.length + " of " + fmtInt(d.totals.total) + " calls.";
    renderCallPane();
  }

  function renderCallPane() {
    var pane = $("call-pane"), r = null;
    clear(pane);
    visible().forEach(function (x) { if (callId(x) === state.sel) r = x; });
    if (!r) {
      pane.appendChild(el("div", { "class": "empty-pane" }, el("div", { "class": "big" }, ic("calls")), el("div", { "class": "title", text: "No call selected" }),
        el("div", { text: "Pick a call on the left to see why it was allowed, held or blocked." })));
      return;
    }
    var color = { allow: "ok", review: "warn", block: "bad" }[r.action] || "";
    pane.appendChild(el("div", { "class": "pane-head" },
      el("span", { "class": "tile-lg" }, ic(VICON[r.action] || "calls")),
      el("div", null, el("div", { "class": "vbig verdict " + r.action, text: WORD[r.action] || String(r.action) }), el("div", { "class": "sub", text: new Date(r.ts).toLocaleString() })),
      el("span", { "class": "pill " + color }, el("i", { "class": "dot " + color }), "risk " + (Number(r.risk) || 0).toFixed(2))));
    var dl = el("dl", { "class": "facts" });
    [["Policy", r.policy_id || ""], ["Reason", r.reason || ""], ["Source", r.source || ""],
     ["Judged in", r.latency_ms != null ? Math.round(r.latency_ms) + " ms" : ""],
     ["Length", r.tool_len != null ? r.tool_len + " characters" : ""], ["Hash", r.tool_sha || "", "mono"]].forEach(function (p) {
      if (!p[1]) return;
      dl.appendChild(el("dt", { text: p[0] }));
      dl.appendChild(el("dd", { "class": p[2] || "", text: p[1] }));
    });
    pane.appendChild(dl);
    pane.appendChild(el("p", { "class": "foot-note", text: "laya-guard keeps only a hash and the length of each call, never the command text." }));
  }

  function selectCall(id, scroll) {
    state.sel = id;
    Array.prototype.forEach.call($("calls").querySelectorAll(".call"), function (b) {
      var on = b.getAttribute("data-id") === id;
      b.classList.toggle("sel", on);
      if (on && scroll) b.scrollIntoView({ block: "nearest" });
    });
    renderCallPane();
  }
  function move(delta) {
    var rows = visible();
    if (!rows.length) return;
    var i = -1;
    rows.forEach(function (r, n) { if (callId(r) === state.sel) i = n; });
    i = Math.max(0, Math.min(rows.length - 1, (i < 0 ? (delta > 0 ? -1 : rows.length) : i) + delta));
    selectCall(callId(rows[i]), true);
  }

  // --- policies ---
  function renderPolicies(d) {
    var box = $("policies"), rows = d.policies || [];
    clear(box);
    $("pol-lede").textContent = rows.length ? plural(rows.length, "policy", "policies") + " decided calls " + WINDOW_TEXT[d.window] + "." : "No policy decided a call " + WINDOW_TEXT[d.window] + ".";
    $("pol-note").textContent = rows.length ? "Click one to see its calls." : "";
    if (!rows.length) { box.appendChild(el("div", { "class": "empty", text: "No policies matched in this window." })); return; }
    rows.slice(0, 12).forEach(function (p) {
      var meter = el("div", { "class": "meter", "aria-hidden": "true" });
      [["a", p.allow], ["r", p.review], ["b", p.block]].forEach(function (pair) {
        if (!p.count || !pair[1]) return;
        var seg = el("i", { "class": pair[0] });
        seg.style.width = (pair[1] / p.count * 100) + "%";
        meter.appendChild(seg);
      });
      var card = el("button", { type: "button", "class": "card" + (p.block ? " bad" : p.review ? " warn" : ""), "data-policy": p.policy_id },
        el("div", { "class": "t", text: p.policy_id }),
        el("div", { "class": "s", text: plural(p.count, "call", "calls") + ": " + fmtInt(p.allow) + " allowed, " + fmtInt(p.review) + " review, " + fmtInt(p.block) + " blocked" }), meter);
      card.addEventListener("click", function () { $("q").value = p.policy_id; state.query = p.policy_id.toLowerCase(); setFilter("all"); setView("calls"); });
      box.appendChild(card);
    });
  }

  // --- views and data ---
  function render(fresh) {
    var d = state.data;
    renderCta();
    if (d) renderState(d, true);
    if (state.view === "agents") { renderAgentsView(); return; }
    if (!d) return;
    if (state.view === "overview") { renderHero(d, true); renderTape(d); renderCards(d); renderFooter(d, true); }
    else if (state.view === "calls") renderCalls(fresh);
    else if (state.view === "policies") renderPolicies(d);
  }

  // "#/calls", not "#calls": a bare fragment would also scroll to the element with that id
  function hashView() { return (location.hash || "").replace(/^#\/?/, ""); }

  function setView(v, fromHash) {
    if (VIEWS.indexOf(v) < 0) v = "overview";
    state.view = v;
    $("app").setAttribute("data-view", v);
    VIEWS.forEach(function (n) { $("v-" + n).hidden = n !== v; });
    Array.prototype.forEach.call($("nav").querySelectorAll("button"), function (b) {
      if (b.getAttribute("data-view") === v) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
    });
    $("title").textContent = TITLES[v];
    if (!fromHash) { try { history.replaceState(null, "", "#/" + v); } catch (e) { /* the hash is a convenience */ } }
    render(false);
  }

  function load(fresh) {
    return fetch("/api/stats?window=" + encodeURIComponent(state.window), { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function (data) {
        // nothing new: keep the page as it is (no flicker, the selection survives)
        var last = data.tape.length ? data.tape[data.tape.length - 1][1] : "";
        var sig = [data.window, data.totals.total, last, data.health.mock, data.health.logging].join("|");
        var same = state.data && state.sig === sig;
        state.data = data;
        if (same) { if (state.view === "overview") renderFooter(data, true); return; }
        state.sig = sig;
        render(fresh);
      })
      .catch(function () { renderState(null, false); if (state.view === "overview") { renderHero(null, false); renderFooter(null, false); } });
  }

  function setWindow(w) {
    state.window = w; state.seen = null; state.sel = null; state.drawn = false;
    Array.prototype.forEach.call($("windows").querySelectorAll("button"), function (b) { b.setAttribute("aria-pressed", String(b.getAttribute("data-window") === w)); });
    load(false);
  }
  function setFilter(f) {
    state.filter = f;
    Array.prototype.forEach.call($("filters").querySelectorAll("button"), function (b) { b.setAttribute("aria-pressed", String(b.getAttribute("data-filter") === f)); });
    if (state.data && state.view === "calls") renderCalls(false);
  }
  function togglePause() {
    state.paused = !state.paused;
    $("pause-use").setAttribute("href", state.paused ? "#i-play" : "#i-pause");
    $("pause-btn").setAttribute("aria-label", state.paused ? "Resume updates" : "Pause updates");
    if (state.data) { renderState(state.data, true); if (state.view === "overview") renderFooter(state.data, true); }
    if (!state.paused) load(true);
  }
  function toggleHelp(show) { var h = $("help"); h.classList.toggle("show", show == null ? !h.classList.contains("show") : show); }

  // --- the change sheet ---
  function paintDiff(text) {
    var pre = $("sheet-diff");
    clear(pre);
    text.split("\n").forEach(function (line) {
      var cls = (line.indexOf("+++") === 0 || line.indexOf("---") === 0 || line.indexOf("@@") === 0) ? "meta" : line.charAt(0) === "+" ? "add" : line.charAt(0) === "-" ? "del" : "";
      pre.appendChild(el("span", { "class": cls, text: line }));
      pre.appendChild(document.createTextNode("\n"));
    });
  }

  function openSheet(a, action, force) {
    pending = { agent: a.id, action: action, force: !!force, diffId: null };
    $("sheet-title").textContent = (action === "install" ? "Install the hook for " : "Remove the hook from ") + a.name;
    $("sheet-lead").textContent = "Checking what would change in " + a.path + ".";
    clear($("sheet-diff")); $("sheet-diff").hidden = true; clear($("sheet-checks")); $("sheet-err").textContent = "";
    $("sheet-apply").hidden = false; $("sheet-apply").disabled = true; $("sheet-cancel").textContent = "Cancel";
    $("sheet").classList.add("show");
    api("POST", "/api/agents/" + a.id + "/" + action, { scope: "user", mode: "preview", force: !!force }).then(function (j) {
      if (!j.changed) {
        $("sheet-lead").textContent = "Nothing to change in " + j.path + ".";
        $("sheet-apply").hidden = true; $("sheet-cancel").textContent = "Close";
        return;
      }
      pending.diffId = j.diff_id;
      $("sheet-lead").textContent = (action === "install" ? "This adds a hook to " : "This removes the hook from ") + j.path + ". Your other settings stay as they are and the file is backed up first. The JSON is re-indented, so some lines may show as changed.";
      paintDiff(j.diff);
      $("sheet-diff").hidden = false; $("sheet-apply").disabled = false; $("sheet-apply").focus();
    }).catch(function (e) {
      $("sheet-lead").textContent = ""; $("sheet-err").textContent = e.message;
      $("sheet-apply").hidden = true; $("sheet-cancel").textContent = "Close";
    });
  }

  function closeSheet() {
    $("sheet").classList.remove("show");
    pending = null; agentsSig = "";
    loadAgents();
  }
  $("sheet-cancel").addEventListener("click", closeSheet);
  $("sheet").addEventListener("click", function (ev) { if (ev.target === this) closeSheet(); });
  $("sheet-apply").addEventListener("click", function () {
    if (!pending || !pending.diffId) return;
    var btn = this, p = pending;
    btn.disabled = true; $("sheet-err").textContent = "";
    api("POST", "/api/agents/" + p.agent + "/" + p.action, { scope: "user", mode: "apply", diff_id: p.diffId, force: p.force }).then(function (j) {
      $("sheet-title").textContent = p.action === "install" ? "Hook installed" : "Hook removed";
      $("sheet-lead").textContent = "Saved to " + j.path + (j.backup ? ". The previous file is at " + j.backup + "." : ".") +
        (p.action === "install" ? " If Claude Code is already open, restart it so it picks the hook up." : "");
      $("sheet-diff").hidden = true; btn.hidden = true; $("sheet-cancel").textContent = "Close";
      var list = $("sheet-checks");
      clear(list);
      (j.probes || []).forEach(function (c) { list.appendChild(el("li", { "class": c.ok ? "ok" : "no", text: (c.ok ? "Passed: " : "Failed: ") + c.label })); });
      pending = null;
    }).catch(function (e) { btn.disabled = false; $("sheet-err").textContent = e.message; });
  });

  // --- wiring ---
  $("nav").addEventListener("click", function (ev) { var b = ev.target.closest("button"); if (b) setView(b.getAttribute("data-view")); });
  $("windows").addEventListener("click", function (ev) { var b = ev.target.closest("button"); if (b) setWindow(b.getAttribute("data-window")); });
  $("filters").addEventListener("click", function (ev) { var b = ev.target.closest("button"); if (b) setFilter(b.getAttribute("data-filter")); });
  $("cta").addEventListener("click", function () { var a = primary(); if (!a) return; state.agent = a.id; if (a.state === "not-installed" || a.state === "broken") startChange(a); else setView("agents"); });
  $("help-btn").addEventListener("click", function () { toggleHelp(); });
  $("pause-btn").addEventListener("click", togglePause);
  $("help").addEventListener("click", function (ev) { if (ev.target === this) toggleHelp(false); });
  $("calls").addEventListener("click", function (ev) { var b = ev.target.closest(".call"); if (b) selectCall(b.getAttribute("data-id"), false); });
  $("q").addEventListener("input", function () { state.query = this.value.trim().toLowerCase(); if (state.data) renderCalls(false); });
  $("tape").addEventListener("click", function (ev) {
    var t = ev.target.closest(".tick");
    if (!t || !state.data) return;
    var ts = t.getAttribute("data-ts"), v = t.getAttribute("data-v"), hit = null;
    state.data.recent.forEach(function (r) { if (r.ts === ts && LETTER[r.action] === v) hit = r; });
    state.filter = "all"; state.query = ""; $("q").value = "";
    Array.prototype.forEach.call($("filters").querySelectorAll("button"), function (b) { b.setAttribute("aria-pressed", String(b.getAttribute("data-filter") === "all")); });
    if (hit) state.sel = callId(hit);
    setView("calls");
    var cur = $("calls").querySelector(".call.sel");
    if (cur) cur.scrollIntoView({ block: "center" });
  });

  document.addEventListener("keydown", function (ev) {
    if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
    if ($("sheet").classList.contains("show")) { if (ev.key === "Escape") { closeSheet(); ev.preventDefault(); } return; }
    if (ev.target && ev.target.id === "q") { if (ev.key === "Escape") { ev.target.blur(); ev.preventDefault(); } return; }
    var k = ev.key, handled = true;
    if (k === "Escape") { if ($("help").classList.contains("show")) toggleHelp(false); else handled = false; }
    else if (k === "?") toggleHelp();
    else if (k === "/") { setView("calls"); $("q").focus(); }
    else if (k === "j" || k === "ArrowDown") { if (state.view === "calls") move(1); else handled = false; }
    else if (k === "k" || k === "ArrowUp") { if (state.view === "calls") move(-1); else handled = false; }
    else if (k === "p") togglePause();
    else if (k === "a" || k === "r" || k === "b" || k === "0") { setFilter({ a: "allow", r: "review", b: "block", "0": "all" }[k]); setView("calls"); }
    else if (k >= "1" && k <= "5") setWindow(WINDOWS[Number(k) - 1]);
    else handled = false;
    if (handled) ev.preventDefault();
  });

  var resizeTimer = null;
  window.addEventListener("resize", function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () { if (state.data && state.view === "overview") { state.drawn = true; renderTape(state.data); } }, 150);
  });
  window.addEventListener("hashchange", function () { setView(hashView(), true); });
  setInterval(function () { if (!state.paused && !document.hidden) { load(true); loadAgents(); } }, 5000);
  document.addEventListener("visibilitychange", function () { if (!document.hidden && !state.paused) { load(true); loadAgents(); } });
  setView(hashView(), true);
  load(false);
  loadAgents();
})();
</script>
</body>
</html>
