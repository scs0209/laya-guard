<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-label="laya-guard cover">
  <defs>
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a3e635" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#a3e635" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4f46e5" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lg-tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c1d24"/><stop offset="1" stop-color="#0c0d11"/></linearGradient>
    <linearGradient id="lg-eye" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d9ff5c"/><stop offset="1" stop-color="#9be22d"/></linearGradient>
  </defs>
  <rect width="1280" height="640" fill="#0b1020"/>
  <circle cx="200" cy="120" r="320" fill="url(#glow1)"/>
  <circle cx="1150" cy="560" r="360" fill="url(#glow2)"/>
  <!-- logo mark: assets/logo.svg -->
  <g transform="translate(120,170) scale(4.68)">
    <rect width="64" height="64" rx="15" fill="url(#lg-tile)"/>
    <rect x=".5" y=".5" width="63" height="63" rx="14.5" fill="none" stroke="#fff" stroke-opacity=".08"/>
    <path d="M8 32c5.8-10.6 13.8-16 24-16s18.2 5.4 24 16c-5.8 10.6-13.8 16-24 16S13.8 42.6 8 32Z" fill="url(#lg-eye)"/>
    <circle cx="32" cy="32" r="9.5" fill="#0c0d11"/>
    <circle cx="35.2" cy="28.6" r="2.7" fill="#fff"/>
  </g>
  <!-- wordmark -->
  <text x="480" y="300" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
